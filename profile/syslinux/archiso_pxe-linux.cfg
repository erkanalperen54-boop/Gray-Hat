LABEL arch_nbd
TEXT HELP
Boot the Gray-Hat Linux live medium using NBD.
It provides access to the Gray-Hat live environment.
ENDTEXT
MENU LABEL Gray-Hat Linux live medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

