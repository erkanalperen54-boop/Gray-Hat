LABEL arch
TEXT HELP
Boot the Gray-Hat Linux live medium on BIOS.
It provides access to the Gray-Hat live environment.
ENDTEXT
MENU LABEL Gray-Hat Linux live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Gray-Hat Linux live medium on BIOS with speakup screen reader.
It provides access to the Gray-Hat live environment with speech feedback.
ENDTEXT
MENU LABEL Gray-Hat Linux live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
